name: Collect Hiratsuka Tower data

on:
  schedule:
    # GitHub Actions uses UTC. 15 minutes past every hour = JST 00:15, 01:15, ...
    - cron: "45 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Collect data
        run: python main.py

      - name: Save updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hiratsuka_tower.csv debug/latest.html debug/latest.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Hiratsuka Tower data"
            git push
          fi
